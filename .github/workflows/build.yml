name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        scheme: [NotchBuddy, CoucouAppStore]
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd NotchBuddy && xcodegen

      - name: Build ${{ matrix.scheme }} without signing
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Codex hook regression checks
        run: python3 tests/test_codex_hooks.py
